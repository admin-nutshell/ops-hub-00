name: Diagnose S3 first live run (read-only)

# One-off, read-only diagnostic for the first-ever live click of the
# dashboard's "Propose a fix" button (S3, PR #571). The dashboard's poll
# timed out twice with no visible state change — this checks the actual
# fix_attempts/findings rows directly rather than continue guessing from the
# client-side symptom alone.
#
# Read-only: SELECT only, no writes. Connects via OPS_HUB_APP_LOGIN_URL (the
# ops_hub_app role, RLS-scoped) fetched from the ops-hub-staging Coolify app —
# same credential/DSN-fetch mechanism as t60-rls-probe.yml. Never prints the
# DSN password (masked), never prints raw finding.detail/fix_attempts diff
# content (metadata columns only, same no-raw-content discipline as every
# audit_log write elsewhere in this codebase).

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-s3-first-live-run.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  COOLIFY_BASE: "https://coolify.inatechshell.ca/api/v1"
  OPS_HUB_STAGING_UUID: "ajqplom2mghf5a8h6vf1q6xg"
  PILOT_PRODUCT_ID: "8bafa6a6-4d80-4983-89bc-e536d3dba672"

jobs:
  diagnose:
    name: Query findings/fix_attempts state for the pilot product (read-only)
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - name: Guard — required secret present
        run: |
          [ -n "$TOKEN" ] || { echo "::error::COOLIFY_API_TOKEN not set"; exit 1; }

      - name: Fetch staging OPS_HUB_APP_LOGIN_URL from Coolify (masked)
        run: |
          set -euo pipefail
          HTTP=$(curl -s --max-time 30 -o /tmp/staging_envs.json -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" \
            "$COOLIFY_BASE/applications/$OPS_HUB_STAGING_UUID/envs")
          [ "$HTTP" = "200" ] || { echo "::error::cannot read staging envs (HTTP $HTTP)"; head -c 300 /tmp/staging_envs.json; exit 1; }

          LOGIN=$(jq -r '.[] | select(.key=="OPS_HUB_APP_LOGIN_URL" and .is_preview==false) | .value' /tmp/staging_envs.json | head -1)
          if [ -z "$LOGIN" ] || [ "$LOGIN" = "null" ]; then
            echo "::error::OPS_HUB_APP_LOGIN_URL absent on staging app"; exit 1
          fi
          echo "::add-mask::$LOGIN"
          printf '%s' "$LOGIN" > /tmp/login_dsn
          REDACTED=$(printf '%s' "$LOGIN" | sed -E 's#(://[^:]+):[^@]*@#\1:***@#')
          echo "staging OPS_HUB_APP_LOGIN_URL present. Redacted: $REDACTED"

      - name: findings — state for the pilot product (metadata only, no detail blob)
        run: |
          LOGIN=$(cat /tmp/login_dsn); echo "::add-mask::$LOGIN"
          psql "$LOGIN" -c "
            SELECT set_config('app.current_product', '$PILOT_PRODUCT_ID', true);
            SELECT id, finding_type, severity, state, created_at, updated_at
              FROM findings
             WHERE product_id = '$PILOT_PRODUCT_ID'
             ORDER BY updated_at DESC
             LIMIT 20;
          "

      - name: fix_attempts — every attempt for the pilot product (metadata only, no diff content)
        run: |
          LOGIN=$(cat /tmp/login_dsn); echo "::add-mask::$LOGIN"
          psql "$LOGIN" -c "
            SELECT set_config('app.current_product', '$PILOT_PRODUCT_ID', true);
            SELECT id, finding_id, agent, model_alias, status, sandbox_run_id,
                   eval_score, created_at, updated_at
              FROM fix_attempts
             WHERE product_id = '$PILOT_PRODUCT_ID'
             ORDER BY created_at DESC
             LIMIT 20;
          "

      - name: pull_requests — any draft PR rows recorded for the pilot product
        run: |
          LOGIN=$(cat /tmp/login_dsn); echo "::add-mask::$LOGIN"
          psql "$LOGIN" -c "
            SELECT set_config('app.current_product', '$PILOT_PRODUCT_ID', true);
            SELECT id, fix_attempt_id, github_pr_number, branch, state,
                   checks_status, created_at, updated_at
              FROM pull_requests
             WHERE product_id = '$PILOT_PRODUCT_ID'
             ORDER BY created_at DESC
             LIMIT 20;
          "

      # One-off addition (2026-07-27): the 2026-07-27 retry batch produced 5
      # instant-fail fix_attempts rows with no sandbox_run_id — meaning
      # authorFixForFinding's own resolveTargetFilePath/isLockfilePath/
      # fetchTargetFileContent skip path fired before ever calling the LLM,
      # for at least some of these. skipReason itself lives only in
      # audit_log's payload, which is unreadable here (audit_log has no
      # product_id column; its RLS is tenant/project-scoped only, both NULL
      # for product-domain rows — see the note at the end of this file).
      # This step reads findings.detail directly instead (product-scoped,
      # RLS-safe) to see what resolveTargetFilePath would actually extract for
      # each of the 5 known pilot findings, settling "no_target_path_resolved"
      # vs a real resolved path without needing the unreadable audit_log row.
      # resolved_path mirrors resolveTargetFilePath's own precedence exactly
      # (fix-author.ts): a non-blank dependency.manifest_path wins outright,
      # else fall back to a non-blank most_recent_instance.location.path,
      # else NULL — not two independent raw projections. Filtered to the 5
      # known finding IDs (not a bare product-wide LIMIT 20) so the result
      # can never silently drop a target finding or admit an unrelated one as
      # this product's finding count grows past 20.
      - name: findings — detail path fields for the 5 known finding IDs (metadata only)
        run: |
          LOGIN=$(cat /tmp/login_dsn); echo "::add-mask::$LOGIN"
          psql "$LOGIN" -c "
            SELECT set_config('app.current_product', '$PILOT_PRODUCT_ID', true);
            SELECT id, finding_type, severity,
                   COALESCE(
                     NULLIF(TRIM(detail #>> '{dependency,manifest_path}'), ''),
                     NULLIF(TRIM(detail #>> '{most_recent_instance,location,path}'), '')
                   ) AS resolved_path
              FROM findings
             WHERE product_id = '$PILOT_PRODUCT_ID'
               AND id IN (
                 '55f2ae89-e5a8-4b52-b920-170eb51214a8',
                 'b7dee0be-a6c9-4678-a8e8-57169028fb35',
                 'bd18d967-63e3-414b-adfe-a950207afd2c',
                 'cae1e5fe-c2fb-4e7f-aa19-7c3063898a36',
                 '1a36d135-5367-435a-8ba1-dccecd817c7b'
               )
             ORDER BY updated_at DESC;
          "

      # audit_log is intentionally skipped: its RLS (20260618120100, unchanged
      # by the S1 product-domain migration) is still scoped by
      # app.current_tenant/app.current_project only, not app.current_product
      # — connecting with only the product GUC set would silently return
      # zero rows regardless of actual content (fail-closed on the wrong
      # axis), a false negative rather than real signal. Not worth the
      # confusion for a one-off diagnostic.
